name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  collector:
    # ubuntu-latest is now 26.04, which has no Python 3.9 build.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m py_compile plugins/aeo-audit/skills/aeo-audit/scripts/fetch_signals.py
      - name: Tests (local fake site, no network)
        run: python -m unittest discover -s tests -v

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JSON is valid
        run: |
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
          python3 -m json.tool plugins/aeo-audit/.claude-plugin/plugin.json > /dev/null
      - name: Marketplace and plugin pass claude plugin validate
        run: |
          npx -y @anthropic-ai/claude-code plugin validate .claude-plugin/marketplace.json
          npx -y @anthropic-ai/claude-code plugin validate plugins/aeo-audit
      - name: Versions agree
        run: |
          v=$(python3 -c "import json;print(json.load(open('plugins/aeo-audit/.claude-plugin/plugin.json'))['version'])")
          grep -q "## \[$v\]" CHANGELOG.md || { echo "CHANGELOG.md has no entry for $v"; exit 1; }